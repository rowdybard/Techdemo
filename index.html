<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beach Fireworks</title>
<meta name="description" content="A real-time beach at dusk with a firework show anyone can design.">
<link rel="icon" href="data:,">
<style>
  /* One full-bleed dusk scene. The page keeps this dark look whatever the viewer's theme. */
  :root {
    --night: #0b1020;
    --dusk-top: #161e38;
    --dusk-horizon: #4b3f5d;
    --ink: #e9edf5;
    --muted: #98a2b7;
    --glass: rgb(9 13 26 / 0.68);
    --rule: rgb(233 237 245 / 0.14);
    --spark: #ffb45c;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--night); color: var(--ink); font-family: var(--sans); }
  /* The gradient shows while three.js loads, so the first paint already reads as dusk. */
  #app { position: fixed; inset: 0; overflow: hidden; background: linear-gradient(to bottom, var(--dusk-top), var(--dusk-horizon) 62%, var(--night)); }
  #app canvas { display: block; width: 100%; height: 100%; outline: none; }

  .debug { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); left: calc(16px + env(safe-area-inset-left, 0px)); padding: 10px 12px; border-radius: 6px; background: var(--glass); color: var(--ink); font: 12px/1.45 var(--mono); font-variant-numeric: tabular-nums; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; }
  .debug dl { display: grid; grid-template-columns: auto auto; column-gap: 16px; margin: 0; }
  .debug dt { color: var(--muted); }
  .debug dd { margin: 0; text-align: right; }
  .debug p { margin: 8px 0 0; padding-top: 6px; border-top: 1px solid var(--rule); color: var(--muted); }
  .debug.compact { padding: 6px 10px; }
  .debug.compact :is(dt, dd):not(:first-of-type), .debug.compact p { display: none; }

  /* Show designer panel (lil-gui draws the controls; this places and themes it). */
  #app .panel.lil-gui { position: absolute; z-index: 1; top: calc(12px + env(safe-area-inset-top, 0px)); right: calc(16px + env(safe-area-inset-right, 0px)); max-height: calc(100% - 24px - env(safe-area-inset-top, 0px)); overflow-y: auto; border-radius: 8px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  /* lil-gui sets its colours on every folder, so the theme has to as well. */
  #app .panel.lil-gui, #app .panel .lil-gui { --background-color: var(--glass); --title-background-color: rgb(233 237 245 / 0.08); --widget-color: rgb(233 237 245 / 0.12); --hover-color: rgb(233 237 245 / 0.2); --focus-color: rgb(233 237 245 / 0.26); --number-color: var(--spark); --string-color: var(--spark); --font-family: var(--sans); }
  #app .panel .lil-gui { --background-color: transparent; }
  .panel-json { display: grid; gap: 6px; padding: 6px var(--padding, 4px) 8px; }
  .panel-json textarea { width: 100%; box-sizing: border-box; min-height: 7em; padding: 6px; border: 1px solid var(--rule); border-radius: 4px; background: rgb(0 0 0 / 0.35); color: var(--ink); font: 11px/1.4 var(--mono); resize: vertical; }
  .panel-json-row { display: flex; gap: 6px; }
  .panel-json button { flex: 1; padding: 6px 8px; border: 0; border-radius: 4px; background: rgb(233 237 245 / 0.14); color: var(--ink); font: 12px var(--sans); cursor: pointer; }
  .panel-json button:hover { background: rgb(233 237 245 / 0.24); }
  .panel-json button:focus-visible, .hero-exit:focus-visible, .hero-button:focus-visible { outline: 2px solid var(--spark); outline-offset: 2px; }
  .panel-json-status { min-height: 1.2em; margin: 0; color: var(--muted); font-size: 11px; }

  /* Hero mode: the scene as a website header, with a sample headline. */
  .hero, .hero-exit { display: none; }
  .hero-mode .debug, .hero-mode .panel { display: none; }
  .hero-mode .hero { position: absolute; inset: auto 0 0 0; display: grid; gap: 12px; justify-items: start; padding: 96px max(16px, 6vw) calc(max(28px, 7vh) + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to top, rgb(5 7 14 / 0.72), rgb(5 7 14 / 0)); pointer-events: none; }
  .hero-kicker { margin: 0; color: var(--spark); font: 600 13px/1.2 var(--sans); letter-spacing: 0.14em; text-transform: uppercase; }
  .hero-title { max-width: 16ch; margin: 0; color: var(--ink); font: 700 clamp(34px, 6.4vw, 76px)/1.02 var(--sans); letter-spacing: -0.02em; text-wrap: balance; text-shadow: 0 2px 24px rgb(0 0 0 / 0.45); }
  .hero-copy { max-width: 42ch; margin: 0; color: var(--ink); opacity: 0.86; font: 400 clamp(15px, 1.6vw, 19px)/1.5 var(--sans); }
  .hero-button { margin-top: 6px; padding: 13px 22px; border-radius: 999px; background: var(--spark); color: #1a1006; font: 600 15px/1 var(--sans); text-decoration: none; pointer-events: auto; }
  .hero-mode .hero-exit { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: calc(16px + env(safe-area-inset-right, 0px)); display: block; padding: 7px 12px; border: 1px solid var(--rule); border-radius: 999px; background: var(--glass); color: var(--muted); font: 12px var(--sans); cursor: pointer; }

  .notice { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; margin: 0; padding: 0 16px; font-size: 16px; line-height: 1.5; text-align: center; text-wrap: balance; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/",
    "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.21.0/dist/lil-gui.esm.min.js"
  }
}
</script>
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.core.js">
</head>
<body>
<div id="app"></div>
<script type="module">
  import { start } from './src/main.js';
  start(document.getElementById('app'));
</script>
</body>
</html>
